name: Build Multi-Platform

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'spec_common.py'
      - '*.spec'
      - 'setup.py'
      - 'installer/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/build-multiplatform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'spec_common.py'
      - '*.spec'
      - 'setup.py'
      - 'installer/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/build-multiplatform.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  detect-release:
    name: Detect Release Version Change
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      version: ${{ steps.detect.outputs.version }}
      tag_name: ${{ steps.detect.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect version change
        id: detect
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import tomllib

          def set_output(name: str, value: str) -> None:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write(f"{name}={value}\n")

          before = os.environ.get("GITHUB_EVENT_BEFORE", "")
          current = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          previous = None

          if before and before != "0000000000000000000000000000000000000000":
              try:
                  previous_text = subprocess.check_output(
                      ["git", "show", f"{before}:pyproject.toml"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
                  previous = tomllib.loads(previous_text)["project"]["version"]
              except Exception:
                  previous = None

          should_release = previous != current
          tag_name = f"v{current}"

          print(f"previous={previous}")
          print(f"current={current}")
          print(f"should_release={str(should_release).lower()}")

          set_output("should_release", str(should_release).lower())
          set_output("version", current)
          set_output("tag_name", tag_name)
          PY
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

  build-windows:
    name: Build Windows EXE & Installer
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements-windows.txt
            pyproject.toml

      - name: Validate version consistency
        run: |
          $code = @'
          import pathlib
          import re
          import sys
          import tomllib

          errors = []

          py = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          expected = py["project"]["version"]

          # 1. src/__init__.py
          txt = pathlib.Path("src/__init__.py").read_text(encoding="utf-8")
          m = re.search(r"__version__\s*=\s*\"([^\"]+)\"", txt)
          actual = m.group(1) if m else None
          if actual != expected:
              errors.append(f"src/__init__.py: {actual} != {expected}")

          # 2. installer/installer.nsi (default PRODUCT_VERSION)
          nsi = pathlib.Path("installer/installer.nsi").read_text(encoding="utf-8")
          m = re.search(r'!define PRODUCT_VERSION "([^\"]+)"', nsi)
          actual = m.group(1) if m else None
          if actual != expected:
              errors.append(f"installer/installer.nsi: {actual} != {expected}")

          # 3. version_info.txt
          vi = pathlib.Path("version_info.txt").read_text(encoding="utf-8")
          m = re.search(r"prodvers=\(([^)]*)\)", vi)
          if not m:
              errors.append("version_info.txt: prodvers not found")
          else:
              nums = [p.strip() for p in m.group(1).split(",")[:3]]
              if nums != expected.split("."):
                  errors.append(f"version_info.txt prodvers: {nums} != {expected}")

          # 4. CHANGELOG.md has an entry for the current version
          cl = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          if f"[{expected}]" not in cl:
              errors.append(f"CHANGELOG.md: missing [{expected}] entry")

          for e in errors:
              print(f"VERSION MISMATCH: {e}")
          print(f"expected version: {expected}")
          sys.exit(1 if errors else 0)
          '@
          python -c $code
        shell: pwsh
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.24.0" --only-binary=:all:
          pip install -r requirements-windows.txt --verbose
        shell: pwsh
      
      - name: Build Single-File EXE
        run: |
          New-Item -ItemType Directory -Force -Path build-logs | Out-Null
          python setup.py --build *>&1 | Tee-Object -FilePath build-logs/pyinstaller-single.log
          if ($LASTEXITCODE -ne 0) {
            Write-Error "PyInstaller single-file build failed"
            exit $LASTEXITCODE
          }
        shell: pwsh
      
      - name: Build Directory Mode for Installer
        run: |
          python setup.py --build-dir *>&1 | Tee-Object -FilePath build-logs/pyinstaller-dir.log
          if ($LASTEXITCODE -ne 0) {
            Write-Error "PyInstaller directory build failed"
            exit $LASTEXITCODE
          }
        shell: pwsh
      
      - name: Install NSIS
        run: |
          winget install --id NSIS.NSIS --exact --accept-source-agreements --accept-package-agreements -e --silent
          Start-Sleep -Seconds 10
        shell: pwsh
      
      - name: Build NSIS Installer
        run: |
          $nsisPaths = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe",
            "C:\NSIS\makensis.exe"
          )
          
          $makensis = $null
          foreach ($path in $nsisPaths) {
            if (Test-Path $path) {
              $makensis = $path
              break
            }
          }
          
          if (-not $makensis) {
            Write-Error "NSIS makensis.exe not found"
            exit 1
          }

          $version = (python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])").Trim()
          & $makensis -DPRODUCT_VERSION="$version" "installer\installer.nsi" *>&1 | Tee-Object -FilePath build-logs/nsis.log

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Installer build failed!"
            exit 1
          }
        shell: pwsh

      - name: Upload Windows build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-logs
          path: |
            build-logs/**
            build/**
          retention-days: 14
          if-no-files-found: warn
      
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: ha-assistant-windows-exe
          path: dist/HomeAssistantWindows.exe
          retention-days: 30
      
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v7
        with:
          name: ha-assistant-windows-installer
          path: dist/HomeAssistantWindows_Setup.exe
          retention-days: 30

  release:
    name: Create Release
    needs: [detect-release, build-windows]
    if: needs.detect-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Download Windows EXE
        uses: actions/download-artifact@v8
        with:
          name: ha-assistant-windows-exe
          path: dist/
      
      - name: Download Windows Installer
        uses: actions/download-artifact@v8
        with:
          name: ha-assistant-windows-installer
          path: dist/
      
      - name: Generate latest.json
        run: |
          version="${{ needs.detect-release.outputs.version }}"
          echo "{\"version\": \"$version\"}" > dist/latest.json
        shell: bash

      - name: Generate changelog
        id: changelog
        uses: Desmond-Dong/actions/bilingual-changelog@main
        with:
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          llm-api-url: ${{ secrets.LLM_API_URL }}
          llm-model: ${{ secrets.LLM_MODEL }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.detect-release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.detect-release.outputs.tag_name }}
          files: |
            dist/HomeAssistantWindows.exe
            dist/HomeAssistantWindows_Setup.exe
            dist/latest.json
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
